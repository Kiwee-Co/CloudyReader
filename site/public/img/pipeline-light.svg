<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Cloudy Reader reading pipeline</title>
<desc id="desc">A pasted question goes through the parser, entity detection, and name lookups: the lexicon and a local cache, then OPSIN on the Mac, then PubChem or UniProt over HTTPS unless offline. Then the normalizer, respelling to IPA, a Piper or Kokoro voice, the WAV cache, and the afplay player. Missing voice files download once at start over HTTPS unless offline. --offline or CLOUDYREADER_OFFLINE=1 stops the lookups and the voice download; Online lookups off stops only PubChem and UniProt. Everything else runs on the Mac.</desc>
<defs><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000" fill-opacity="0.5"/></marker></defs>
<rect x="0" y="0" width="980" height="540" rx="16" fill="#ffffff"/>
<text x="32" y="44" font-size="18" font-weight="700" fill="#1d1d1f">From pasted text to sound</text>
<rect x="640" y="32" width="18" height="14" rx="4" stroke-width="1" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18"/>
<text x="664" y="44" font-size="12" fill="#3a3a3c">on the Mac</text>
<rect x="760" y="32" width="18" height="14" rx="4" fill="#eaf3ff" stroke="#0a64d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="784" y="44" font-size="12" fill="#3a3a3c">network (HTTPS)</text>
<rect x="32" y="70" width="160" height="78" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="46" y="94" font-size="14" font-weight="600" fill="#1d1d1f">Question text</text>
<text x="46" y="114" font-size="12" fill="#3a3a3c">pasted, or from</text>
<text x="46" y="131" font-size="12" fill="#3a3a3c">the clipboard</text>
<rect x="232" y="70" width="160" height="78" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="246" y="94" font-size="14" font-weight="600" fill="#1d1d1f">Parser</text>
<text x="246" y="114" font-size="12" fill="#3a3a3c">toss-up or bonus,</text>
<text x="246" y="131" font-size="12" fill="#3a3a3c">category, choices</text>
<rect x="432" y="70" width="200" height="78" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="446" y="94" font-size="14" font-weight="600" fill="#1d1d1f">Entity detection</text>
<text x="446" y="114" font-size="12" fill="#3a3a3c">scispaCy CRAFT model</text>
<text x="446" y="131" font-size="12" fill="#3a3a3c">plus regexes</text>
<rect x="672" y="70" width="276" height="160" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="686" y="94" font-size="14" font-weight="600" fill="#1d1d1f">Name lookups</text>
<text x="686" y="114" font-size="12" fill="#3a3a3c">1. lexicon, then the local</text>
<text x="686" y="131" font-size="12" fill="#3a3a3c">    cache (SQLite)</text>
<text x="686" y="148" font-size="12" fill="#3a3a3c">2. OPSIN (Java, on the Mac)</text>
<rect x="686" y="172" width="248" height="44" rx="10" fill="#eaf3ff" stroke="#0a64d6" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="700" y="196" font-size="14" font-weight="600" fill="#0a64d6">3. PubChem or UniProt</text>
<rect x="672" y="270" width="276" height="96" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="686" y="294" font-size="14" font-weight="600" fill="#1d1d1f">Normalizer</text>
<text x="686" y="314" font-size="12" fill="#3a3a3c">lexicon, units, formulas, choices;</text>
<text x="686" y="331" font-size="12" fill="#3a3a3c">the answer line only when</text>
<text x="686" y="348" font-size="12" fill="#3a3a3c">Read answer line is on</text>
<rect x="432" y="270" width="200" height="96" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="446" y="294" font-size="14" font-weight="600" fill="#1d1d1f">Respelling to IPA</text>
<text x="446" y="314" font-size="12" fill="#3a3a3c">Bracket guides to IPA;</text>
<text x="446" y="331" font-size="12" fill="#3a3a3c">Kokoro: misaki</text>
<rect x="232" y="270" width="160" height="96" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="246" y="294" font-size="14" font-weight="600" fill="#1d1d1f">Voice</text>
<text x="246" y="314" font-size="12" fill="#3a3a3c">Piper (espeak-ng) or</text>
<text x="246" y="331" font-size="12" fill="#3a3a3c">Kokoro (Apple</text>
<text x="246" y="348" font-size="12" fill="#3a3a3c">Silicon only)</text>
<rect x="32" y="270" width="160" height="96" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="46" y="294" font-size="14" font-weight="600" fill="#1d1d1f">WAV cache</text>
<text x="46" y="314" font-size="12" fill="#3a3a3c">one file per script,</text>
<text x="46" y="331" font-size="12" fill="#3a3a3c">voice, speed, speaker</text>
<rect x="32" y="400" width="160" height="56" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="46" y="424" font-size="14" font-weight="600" fill="#1d1d1f">Player</text>
<text x="46" y="444" font-size="12" fill="#3a3a3c">afplay</text>
<rect x="232" y="400" width="260" height="56" rx="10" fill="#eaf3ff" stroke="#0a64d6" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="246" y="424" font-size="14" font-weight="600" fill="#0a64d6">Voice download at start</text>
<text x="246" y="444" font-size="12" fill="#3a3a3c">missing pinned voices</text>
<rect x="512" y="400" width="436" height="112" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="526" y="424" font-size="14" font-weight="600" fill="#1d1d1f">Offline switches</text>
<text x="526" y="444" font-size="12" fill="#3a3a3c">--offline or CLOUDYREADER_OFFLINE=1:</text>
<text x="526" y="461" font-size="12" fill="#3a3a3c">no name lookups and no voice download</text>
<text x="526" y="478" font-size="12" fill="#3a3a3c">Online lookups off:</text>
<text x="526" y="495" font-size="12" fill="#3a3a3c">no PubChem or UniProt; voices still download</text>
<path d="M192 109L232 109" fill="none" stroke-width="1.5" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<path d="M392 109L432 109" fill="none" stroke-width="1.5" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<path d="M632 109L672 109" fill="none" stroke-width="1.5" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<path d="M810 230L810 270" fill="none" stroke-width="1.5" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<path d="M672 318L632 318" fill="none" stroke-width="1.5" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<path d="M432 318L392 318" fill="none" stroke-width="1.5" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<path d="M232 318L192 318" fill="none" stroke-width="1.5" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<path d="M112 366L112 400" fill="none" stroke-width="1.5" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<path d="M312 400L312 366" fill="none" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
</svg>
