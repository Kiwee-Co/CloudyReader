<text x="14" y="16.91" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.85">Cloudy Reader</text>
<text x="127.59" y="16.91" font-size="13" fill="#ffffff" fill-opacity="0.85">File</text>
<text x="168.31" y="16.91" font-size="13" fill="#ffffff" fill-opacity="0.85">Edit</text>
<rect x="204.33" y="3" width="62.67" height="18" rx="5" fill="#ffffff" fill-opacity="0.12"/>
<text x="211.33" y="16.91" font-size="13" fill="#ffffff" fill-opacity="0.85">Reading</text>
<text x="280" y="16.91" font-size="13" fill="#ffffff" fill-opacity="0.85">Window</text>
<rect x="201.33" y="33" width="204.28" height="109" rx="8" filter="url(#blur1)" fill="#000000" fill-opacity="0.55"/>
<rect x="201.33" y="27" width="204.28" height="109" rx="8" stroke-width="0.5" fill="#2b2b2b" stroke="#ffffff" stroke-opacity="0.16"/>
<text x="222.33" y="47.91" font-size="13" fill="#ffffff" fill-opacity="0.85">Speak</text>
<text x="389.61" y="47.91" text-anchor="end" font-size="13" fill="#ffffff" fill-opacity="0.5">⌘↩</text>
<text x="222.33" y="69.91" font-size="13" fill="#ffffff" fill-opacity="0.85">Speak Clipboard</text>
<text x="389.61" y="69.91" text-anchor="end" font-size="13" fill="#ffffff" fill-opacity="0.5">⇧⌘V</text>
<path d="M211.33 81.5H395.61" stroke-width="1" stroke="#838383"/>
