<title id="title">Engine rows and the first use of an engine</title>
<desc id="desc">Two parts in Dark Mode. First, the Voice menu open while an engine downloads: the end of the Kokoro list, the Chatterbox Turbo voice, the two Qwen3-TTS voices dimmed with the reason not downloaded yet, then the Piper voices; the status bar shows Downloading Qwen3-TTS… 20% (412 of 1,974 MB) with its progress bar. Second, the status bar during the first reading with Chatterbox Turbo: Preparing… loading Chatterbox Turbo (first use only) with the busy bar.</desc>
