<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="460" height="422" viewBox="0 0 460 422" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Install and first open</title>
<desc id="desc">Four steps of the first open: download the disk image, drag Cloudy Reader to Applications, open it, then click Open Anyway in System Settings &gt; Privacy &amp; Security.</desc>
<defs><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000" fill-opacity="0.5"/></marker></defs>
<rect x="0" y="0" width="460" height="422" rx="16" fill="#ffffff"/>
<text x="32" y="40" font-size="18" font-weight="700" fill="#1d1d1f">Install and first open</text>
<rect x="32" y="60" width="396" height="64" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<circle cx="56" cy="79" r="11" fill="#0a64d6"/>
<text x="56" y="83.5" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<text x="76" y="84" font-size="14" font-weight="600" fill="#1d1d1f">Download the disk image</text>
<text x="76" y="104" font-size="12" fill="#3a3a3c">from the Download page</text>
<rect x="32" y="150" width="396" height="64" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<circle cx="56" cy="169" r="11" fill="#0a64d6"/>
<text x="56" y="173.5" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<text x="76" y="174" font-size="14" font-weight="600" fill="#1d1d1f">Drag Cloudy Reader to Applications</text>
<text x="76" y="194" font-size="12" fill="#3a3a3c">open the disk image and drag the app to Applications</text>
<rect x="32" y="240" width="396" height="64" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<circle cx="56" cy="259" r="11" fill="#0a64d6"/>
<text x="56" y="263.5" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
<text x="76" y="264" font-size="14" font-weight="600" fill="#1d1d1f">Open it</text>
<text x="76" y="284" font-size="12" fill="#3a3a3c">macOS blocks the first open of this app</text>
<rect x="32" y="330" width="396" height="64" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<circle cx="56" cy="349" r="11" fill="#0a64d6"/>
<text x="56" y="353.5" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
<text x="76" y="354" font-size="14" font-weight="600" fill="#1d1d1f">Click Open Anyway in Privacy &amp; Security</text>
<text x="76" y="374" font-size="12" fill="#3a3a3c">System Settings &gt; Privacy &amp; Security</text>
<path d="M230 124L230 150" fill="none" stroke-width="1.5" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<path d="M230 214L230 240" fill="none" stroke-width="1.5" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<path d="M230 304L230 330" fill="none" stroke-width="1.5" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
</svg>
