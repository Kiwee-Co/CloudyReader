<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="458" viewBox="0 0 520 458" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">What uses the network</title>
<desc id="desc">The Mac, with the question box and a voice, and three outside services: a name lookup sends one detected name to PubChem or UniProt, and the voice download requests voice files from Hugging Face. --offline or CLOUDYREADER_OFFLINE=1 stops both; Online lookups off stops only the name lookups. Everything else stays on the Mac.</desc>
<defs><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000" fill-opacity="0.5"/></marker></defs>
<rect x="0" y="0" width="520" height="458" rx="16" fill="#ffffff"/>
<text x="32" y="44" font-size="18" font-weight="700" fill="#1d1d1f">What uses the network</text>
<rect x="32" y="60" width="18" height="14" rx="4" stroke-width="1" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18"/>
<text x="56" y="72" font-size="12" fill="#3a3a3c">on the Mac</text>
<rect x="152" y="60" width="18" height="14" rx="4" fill="#eaf3ff" stroke="#0a64d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="176" y="72" font-size="12" fill="#3a3a3c">network (HTTPS)</text>
<rect x="32" y="92" width="456" height="138" rx="12" stroke-width="1" fill="#ffffff" stroke="#000000" stroke-opacity="0.18"/>
<text x="46" y="114" font-size="14" font-weight="600" fill="#1d1d1f">Your Mac</text>
<rect x="48" y="126" width="276" height="84" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="62" y="150" font-size="14" font-weight="600" fill="#1d1d1f">Question box</text>
<text x="62" y="170" font-size="12" fill="#3a3a3c">the pasted question</text>
<rect x="340" y="126" width="132" height="84" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="354" y="150" font-size="14" font-weight="600" fill="#1d1d1f">Voice</text>
<text x="354" y="170" font-size="12" fill="#3a3a3c">Piper or Kokoro</text>
<rect x="48" y="300" width="130" height="64" rx="10" fill="#eaf3ff" stroke="#0a64d6" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="62" y="324" font-size="14" font-weight="600" fill="#0a64d6">PubChem</text>
<text x="62" y="344" font-size="12" fill="#3a3a3c">chemical names</text>
<rect x="194" y="300" width="130" height="64" rx="10" fill="#eaf3ff" stroke="#0a64d6" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="208" y="324" font-size="14" font-weight="600" fill="#0a64d6">UniProt</text>
<text x="208" y="344" font-size="12" fill="#3a3a3c">proteins, genes</text>
<rect x="340" y="300" width="132" height="64" rx="10" fill="#eaf3ff" stroke="#0a64d6" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="354" y="324" font-size="14" font-weight="600" fill="#0a64d6">Hugging Face</text>
<text x="354" y="344" font-size="12" fill="#3a3a3c">voice files</text>
<path d="M113 210L113 300" fill="none" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<path d="M259 210L259 300" fill="none" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<text x="186" y="262" text-anchor="middle" font-size="12" fill="#3a3a3c">one detected name</text>
<path d="M406 300L406 210" fill="none" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow1)" stroke="#000000" stroke-opacity="0.5"/>
<text x="414" y="262" text-anchor="start" font-size="12" fill="#3a3a3c">voice files</text>
<rect x="32" y="386" width="456" height="52" rx="10" fill="#f2f2f7" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
<text x="46" y="406" font-size="12" fill="#3a3a3c">Offline mode (--offline or CLOUDYREADER_OFFLINE=1) stops both.</text>
<text x="46" y="423" font-size="12" fill="#3a3a3c">Online lookups off stops only the name lookups.</text>
</svg>
