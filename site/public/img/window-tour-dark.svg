<title id="title">The parts of the Cloudy Reader window</title>
<desc id="desc">The main window in Dark Mode during a reading: the question box, the Voice and Rotation menus, the two options, the Paste and Speak Clipboard buttons, the Repeat, Stop, and Speak buttons, the Spoken script, and the status bar.</desc>
