<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="64" viewBox="0 0 680 64" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">A busy status bar</title>
<desc id="desc">The status bar in Dark Mode while a reading is prepared during the voice download: Preparing… on the left, then Downloading Kokoro… 42% (144 of 342 MB) with its progress bar on the right.</desc>
<defs><clipPath id="clip1"><rect x="0" y="36" width="680" height="28"/></clipPath></defs>
<rect x="0" y="36" width="680" height="28" fill="#323232"/>
<g clip-path="url(#clip1)">
<path d="M0 36.25H680" stroke-width="0.5" stroke="#838383"/>
<text x="20" y="54.53" font-size="12" style="font-variant-numeric:tabular-nums" textLength="64.12" lengthAdjust="spacingAndGlyphs" fill="#ffffff" opacity="0.85">Preparing…</text>
<text x="532" y="54.59" text-anchor="end" font-size="12" style="font-variant-numeric:tabular-nums" fill="#ffffff" textLength="252.06" lengthAdjust="spacingAndGlyphs" opacity="0.85">Downloading Kokoro… 42% (144 of 342 MB)</text>
<rect x="540" y="47" width="120" height="6" rx="3" fill="#474747"/>
<rect x="540" y="47" width="50.4" height="6" rx="3" fill="#1c6cdc"/>
</g>
<rect x="0.25" y="36.25" width="679.5" height="27.5" fill="none" stroke-width="0.5" stroke="#ffffff" stroke-opacity="0.14"/>
</svg>
