<path d="M0 0.25H680" stroke-width="0.5" stroke="#838383"/>
<text x="406" y="18.09" font-size="12" fill="#000000" fill-opacity="0.85">Downloading voices… 42%</text>
<rect x="564" y="12" width="96" height="6" rx="3" fill="#e0e0e0"/>
<rect x="564" y="12" width="40.32" height="6" rx="3" fill="#077eff"/>
</g>
<rect x="0.25" y="0.25" width="679.5" height="28.5" fill="none" stroke-width="0.5" stroke="#000000" stroke-opacity="0.2"/>
