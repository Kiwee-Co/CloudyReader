<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="118" viewBox="0 0 680 118" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Voice download progress</title>
<desc id="desc">The status bar in Dark Mode while voices download: Downloading Kokoro… 42% (144 of 342 MB) with its progress bar; then the same with Preparing in the message.</desc>
<defs><clipPath id="clip1"><rect x="0" y="22" width="680" height="28"/></clipPath><clipPath id="clip2"><rect x="0" y="90" width="680" height="28"/></clipPath></defs>
<text x="0" y="13" font-size="12" font-weight="600" fill="#ffffff" opacity="0.85">Downloading voices</text>
<rect x="0" y="22" width="680" height="28" fill="#323232"/>
<g clip-path="url(#clip1)">
<path d="M0 22.25H680" stroke-width="0.5" stroke="#838383"/>
<text x="528" y="40.59" text-anchor="end" font-size="12" style="font-variant-numeric:tabular-nums" fill="#aeaeb2" textLength="252.06" lengthAdjust="spacingAndGlyphs">Downloading Kokoro… 42% (144 of 342 MB)</text>
<rect x="536" y="33" width="120" height="6" rx="3" fill="#474747"/>
<rect x="536" y="33" width="50.4" height="6" rx="3" fill="#1c6cdc"/>
</g>
<rect x="0.25" y="22.25" width="679.5" height="27.5" fill="none" stroke-width="0.5" stroke="#ffffff" stroke-opacity="0.14"/>
<text x="0" y="81" font-size="12" font-weight="600" fill="#ffffff" opacity="0.85">Downloading voices while a reading is prepared</text>
<rect x="0" y="90" width="680" height="28" fill="#323232"/>
<g clip-path="url(#clip2)">
<path d="M0 90.25H680" stroke-width="0.5" stroke="#838383"/>
<text x="24" y="108.53" font-size="12" style="font-variant-numeric:tabular-nums" textLength="64.12" lengthAdjust="spacingAndGlyphs" fill="#aeaeb2">Preparing…</text>
<text x="528" y="108.59" text-anchor="end" font-size="12" style="font-variant-numeric:tabular-nums" fill="#aeaeb2" textLength="252.06" lengthAdjust="spacingAndGlyphs">Downloading Kokoro… 42% (144 of 342 MB)</text>
<rect x="536" y="101" width="120" height="6" rx="3" fill="#474747"/>
<rect x="536" y="101" width="50.4" height="6" rx="3" fill="#1c6cdc"/>
</g>
<rect x="0.25" y="90.25" width="679.5" height="27.5" fill="none" stroke-width="0.5" stroke="#ffffff" stroke-opacity="0.14"/>
