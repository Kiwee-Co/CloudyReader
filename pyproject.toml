[project]
name = "cloudyreader"
version = "0.0.1"
description = "Reads US DOE National Science Bowl questions aloud with science-aware pronunciation."
requires-python = ">=3.12,<3.13"
dependencies = [
    # spacy 3.7.5 imports click; typer 0.27 no longer installs it.
    "click==8.5.0",
    "httpx==0.28.1",
    "inflect==7.6.0",
    "jdk4py==25.0.2.1",
    "piper-tts==1.8.0",
    "py2opsin==1.2.0",
    "pyside6-essentials==6.12.0",
    "scispacy==0.6.2",
    "sounddevice==0.5.6",
    # `make models` installs en_ner_craft_md 0.5.4 (SHA256-pinned), which needs spacy>=3.7.4,<3.8.0.
    "spacy==3.7.5",
]

[project.optional-dependencies]
# Kokoro engine, Apple Silicon only; `make kokoro` installs it. Plain misaki: misaki[en] pulls torch.
kokoro = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "espeakng-loader==0.2.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki==0.9.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx==0.32.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio==0.6.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "num2words==0.5.14 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "phonemizer-fork==3.3.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
cloudyreader = "cloudyreader.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pytest-qt==4.5.0",
    "pyyaml==6.0.3",
    "respx==0.23.1",
    "ruff==0.17.3",
]
# Not a default group: `make app` syncs it with `uv sync --frozen --inexact --group packaging`.
packaging = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.9",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
# Never lint downloads or other agents' spike trees.
extend-exclude = [".cache", ".data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
qt_api = "pyside6"
markers = [
    "model: needs a scispaCy model from `make models`",
    "voice: needs a Piper voice from `make voices`",
    "network: needs internet access",
    "java: starts a JVM (OPSIN)",
    "slow: takes more than about a second",
]
