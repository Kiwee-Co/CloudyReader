# Local hooks only: they run the venv's pinned ruff, pygrep checks and shellcheck, no network clone.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types_or: [python, pyi]

      # The hooks below only read: they report a hit and never rewrite a file.
      # Fixtures, golden data, a font licence and docs/CNAME hold odd whitespace on purpose.
      - id: trailing-whitespace
        name: no trailing whitespace
        entry: '[ \t]+$'
        language: pygrep
        types: [text]
        exclude: ^(tests/fixtures/|tests/golden/|docs/assets/fonts/|docs/CNAME$)
      - id: end-of-file
        name: file ends with a newline
        entry: '[^\n]\Z'
        language: pygrep
        args: [--multiline]
        types: [text]
        exclude: ^(tests/fixtures/|tests/golden/|docs/assets/fonts/|docs/CNAME$)
      - id: merge-conflict
        name: no merge-conflict markers
        entry: '^(<{7}|>{7})( |$)'
        language: pygrep
        types: [text]
      - id: private-key
        name: no private-key blocks
        entry: '-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY( BLOCK)?-----'
        language: pygrep
        types: [text]
      # The patterns below are escaped so this file never matches its own hooks.
      - id: vendor-domain
        name: no vendor domain
        entry: 'apple\.co[m]'
        language: pygrep
        args: [--ignore-case]
        types: [text]
      # One test asserts that these paths are absent from output; scripts/ci_guards.py holds the lines.
      - id: disk-paths
        name: no machine disk paths
        entry: '/(Volumes|Users)/'
        language: pygrep
        types: [text]
        exclude: ^tests/integration/test_nsb_corpus\.py$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      # Formatting follows .prettierrc and .markdownlint.json. Each exclude lists files that fail
      # today, so only clean files are enforced. The one reformat commit deletes the lists.
      - id: prettier
        name: prettier --check
        entry: prettier --check
        language: system
        types_or: [markdown, yaml, json]
        exclude: |
          (?x)^(
            README\.md
            | docs/custom-domain\.md
            | docs/developer/architecture\.md
            | docs/developer/building\.md
            | docs/developer/testing\.md
            | docs/index\.md
            | docs/manual/getting-started\.md
            | docs/manual/offline-and-privacy\.md
            | docs/manual/pronunciation\.md
            | docs/manual/settings-and-cli\.md
            | docs/manual/troubleshooting\.md
            | docs/manual/using-the-app\.md
            | docs/manual/voices\.md
          )$
      - id: markdownlint
        name: markdownlint
        entry: markdownlint
        language: system
        types: [markdown]
        exclude: |
          (?x)^(
            docs/index\.md
            | docs/manual/using-the-app\.md
            | docs/manual/voices\.md
          )$
