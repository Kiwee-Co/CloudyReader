# Golden respelling -> General American IPA cases.
# Input: bracket text without brackets, as printed. CAPS = stressed syllable, hyphen = syllable break, space = word break.
# Output: IPA with no syllable dots, one primary-stress mark (ˈ) immediately before each CAPS syllable, words joined
# by one space.
#   surface  the printed word the respelling belongs to (descriptive; the conversion keys on `respelling`).
#   ipa      Reference output. Uses U+0261 (ɡ) and U+0279 (ɹ), the eSpeak and Piper en_US inventory. Compare after
#            mapping ASCII g -> ɡ and ASCII r -> ɹ.
#   alt_ipa  Other acceptable outputs: rhotic spelling (ɚ and ɝ vs əɹ and ɜɹ), a one-syllable word without the
#            stress mark, and common dictionary variants. A result passes when it is in {ipa} + alt_ipa.
#   fixtures Fixture ids whose stem or choices contain this respelling (empty = conversion-only case).
# Key used for this corpus (greedy longest match, case-insensitive; stress = syllable written in CAPS):
#   vowels     a æ | ah ɑ | aw ɔ | ay eɪ | e ɛ | eh ɛ | ee i | eye aɪ | y aɪ (vowel y: not before a vowel letter) |
#              i ɪ | ih ɪ | o ɑ | oh oʊ | oo u | ow aʊ | oy ɔɪ | u ʌ (stressed) or ə (unstressed) | uh ə
#   r-vowels   ar ɑɹ | air ɛɹ | eer ɪɹ | or ɔɹ | oor ʊɹ | er and ur ɝ (stressed) or ɚ (unstressed)
#   consonants b d f h k l m n p s t v w z as written | g ɡ | j dʒ | r ɹ | y before a vowel letter j | ch tʃ | sh ʃ |
#              zh ʒ | th θ | dh ð | ng ŋ | kw kw | ks ks
# The three examples from the brief hold: FAR-ingks -> ˈfɑɹɪŋks, i-SOF-uh-guhs -> ɪˈsɑfəɡəs, TRAY-kee-uh -> ˈtɹeɪkiə.

