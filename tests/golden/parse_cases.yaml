# Golden parse cases. One entry per paste in tests/fixtures/questions/ (id = file name without .txt).
# Implementation-agnostic: compare the parsed fields below to these values.
#
# number       int or null. The N) number; null when absent.
# kind         "toss-up" | "bonus" | null. null = no TOSS-UP/BONUS header (any letter case).
# category     Title Case label as printed (EARTH AND SPACE SCIENCE -> "Earth and Space Science"); null when
#              absent. Compare case-insensitively.
# fmt          "multiple-choice" | "short-answer" | null. The printed label; null when the paste prints none
#              (choices, if any, are still listed in `choices`).
# stem         Text after the header, number, category and format label, up to the first choice marker (or the
#              ANSWER line). Whitespace-normalized: each run of Unicode whitespace (space, tab, CR, LF, NBSP)
#              becomes one space and the ends are trimmed. Every other character is kept as printed (curly
#              quotes, Greek letters, the multiplication and minus signs, superscripts). Respelling guides
#              ([FAR-ingks] style) are REMOVED together with the space before them; `respellings` carries them.
#              Other bracketed text ([H+], [Ca2+], [A], [NH3], [1]) is not a guide and stays verbatim.
# choices      Mapping W..Z -> choice text, same normalization, marker removed, guides removed. The markers
#              W) w) W. W: and W)text all map to the upper-case key. {} when the paste has no choices.
# respellings  [{surface, respelling}] in reading order. surface = the printed word(s) the guide belonged to; it
#              still appears in the stem or a choice. respelling = guide text without brackets, as printed.
#              Brackets that are not respellings never appear here. A guide inside the answer is NOT extracted
#              and stays in `answer` (the answer is not spoken unless read_answer is true).
# answer       Whitespace-normalized text after the ANSWER marker (the "ANSWER:" prefix excluded) up to the end
#              of that question, ACCEPT / DO NOT ACCEPT lines included; null when absent.
#
# Multi-question pastes (fixtures 60, 61, 62): the entry has `questions` (a list in paste order) instead of the
# flat keys. Each item has the keys above. A question starts at a TOSS-UP/BONUS header or at a line-initial N)
# that follows a blank line, an ANSWER line or the start of the paste.
# tests/fixtures/tossup_earth_science.txt is byte-identical to fixture 01 (the first sample only).

