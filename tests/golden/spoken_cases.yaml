# Golden spoken-script cases (authoritative convention from the PM). One entry per fixture; id = fixture id.
# A variant entry has `fixture` (the fixture id) and `options` (here read_answer: true). Default: read_answer false.
#
# Segments, per question, in this order. A segment exists only when its source is printed in the paste.
# Pause = silence after the segment, in ms.
#   kind+number  "Toss-up number two." / "Bonus number two." (400). No number: "Toss-up." / "Bonus.". Kind missing,
#                number known: "Question number two.". Neither known: no segment.
#   category     "Earth Science." Title Case (300).
#   format       "Multiple choice." / "Short answer." (500). Only when the paste prints the label (fmt is null in
#                parse_cases.yaml otherwise, and nothing is announced).
#   stem         the stem, caps kept (700 when choices follow).
#   choices      "W. <text>" .. "Z. <text>" (400 each). W) w) W. W: all become "W." Short answer has none.
#   answer       only when read_answer is true: the segment before it gets 5000, then "Answer. <text>." with an
#                all-caps answer title-cased (ESOPHAGUS -> Esophagus) and W) -> W. Stems and choices keep caps.
#   The last segment of a question gets 1500 when another question follows.
# SpokenScript.text() = the segment texts joined by single spaces. `exact` compares it.
#
# Comparison rules. fold(x) = collapse whitespace runs to one space, trim, map curly quotes to ASCII quotes
# (U+2018 U+2019 -> ', U+201C U+201D -> ") and en/em dash to hyphen. Apply fold to the script AND to every
# expected string before comparing.
#   exact             fold(text()) == value. Case-sensitive. Only where the convention is pinned.
#   starts_with       fold(text()) starts with value. Case-sensitive.
#   ends_with         fold(text()) ends with value. Case-sensitive.
#   segments          ordered list, one item per segment. Item: `text` (equals the segment text) or `starts_with`
#                     (prefix, used where a respelling or formula makes the rest open), plus optional `pause_ms`.
#                     pause_ms is present only where the convention states it; absent = not asserted.
#   in_order          every item occurs, left to right, each after the end of the previous match. Case-insensitive.
#   must_contain      every item occurs. Case-insensitive.
#   must_contain_any  list of groups. Each group needs at least one member present. Case-insensitive. Encodes
#                     open conventions, for example "negative" vs "minus" or how a bracket is read aloud.
#   must_not_contain  no item occurs. Case-sensitive, so "ANSWER" never hits the spoken label "Answer.".
#
# Every case forbids: "[", "]", "ANSWER", each raw respelling that contains an upper-case letter (it is
# spoken as a pronunciation, never read as letters), and for multiple choice the raw markers "W)" "X)" "Y)" "Z)".
# A respelled word is satisfied by any member of its must_contain_any group: the printed word, the lowercase
# respelling (hyphens kept, removed or spaced) or an IPA string from respelling_cases.yaml. Pronunciation quality
# is tested through respelling_cases.yaml, not here.
# Pinned formula reading: H2O -> "H two O", CO2 -> "C O two" (letters spelled, digits as words).
# R5: a formula or ion is spoken as letters and digits (NaHCO3 -> "N a H C O three"), never as a name. A case
# forbids the name (baking soda, sodium chloride, hydroxide, ...) unless that word is itself in the printed text.
# Answer-only text (text that appears only in the answer) is forbidden in the script unless read_answer is true.
# Where a symbol could resolve to a name that gives the answer away (SO4 2- -> sulfate), the case forbids the name.

