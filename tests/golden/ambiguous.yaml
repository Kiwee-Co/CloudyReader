# Genuinely ambiguous inputs with a recommended behavior and the reason. NOT asserted by spoken_cases.yaml or
# parse_cases.yaml unless a fixture is named in the entry. Promote an entry to a fixture once the behavior is decided.
# readings         the plausible interpretations.
# recommended      the behavior to implement.
# why              the deciding argument.
# confidence       high | medium | low, how sure the recommendation is.

version: 2
cases:
  - id: "bracket-acronym-dna"
    input: "Deoxyribonucleic acid [DNA] is the genetic material of most organisms."
    readings:
      - "respelling: speak [DNA] as a word"
      - "acronym gloss: speak the letters D N A"
    recommended: "Not a respelling. Speak the bracket content as the letters D N A. Brackets stay silent."
    why: "DNA is in the acronym lexicon and fails respelling shape: no hyphen, and DN is not a legal onset. Letter reading is the moderator convention."
    confidence: "medium"
  - id: "bracket-formula-nacl"
    input: "Table salt [NaCl] dissolves readily in water."
    readings:
      - "respelling"
      - "formula annotation"
      - "concentration of NaCl"
    recommended: "Not a respelling. Speak the formula as N a C l (or sodium chloride). Read as the concentration of sodium chloride only when [NaCl] is followed by = or a unit."
    why: "Mixed case parses as the element symbols Na and Cl (OPSIN or PubChem hit). A respelling capitalizes whole syllables only, never part of one."
    confidence: "medium"
  - id: "bracket-formula-all-caps-co"
    input: "Carbon monoxide [CO] binds hemoglobin more strongly than oxygen does."
    readings:
      - "respelling for a stressed syllable"
      - "formula annotation"
    recommended: "Not a respelling. Speak the formula as C O (or carbon monoxide)."
    why: "CO is two valid element symbols and a formula-lexicon hit, and it has no hyphen. As a respelling it would give a single stressed syllable with no vowel pair."
    confidence: "medium"
  - id: "bracket-single-syllable-caps-jool"
    input: "The SI unit of energy is the joule [JOOL]."
    readings:
      - "respelling of the preceding word"
      - "acronym gloss"
    recommended: "Respelling. Speak the preceding word joule as the IPA string in respelling_cases (ˈdʒul)."
    why: "JOOL has the vowel digraph OO, sounds like the preceding word, and is absent from the acronym lexicon. A lone all-caps syllable marks stress, not an acronym. Rule: acronym lexicon first, then pronounceable shape."
    confidence: "medium"
  - id: "bracket-pronounceable-acronym-nasa"
    input: "The agency [NASA] funds the mission."
    readings:
      - "respelling: nah-sah"
      - "acronym spoken as a word"
    recommended: "Not a respelling. Speak NASA as the word (IPA ˈnæsə). Brackets stay silent."
    why: "Lexicon precedence. As a respelling NASA would map to ˈnæsɑ, which is wrong."
    confidence: "medium"
  - id: "bracket-lowercase-no-stress"
    input: "Banana [buh-nan-uh] is a fruit."
    readings:
      - "respelling with no stress marked"
      - "not a pronunciation"
    recommended: "Respelling. Convert syllables to IPA and place no primary-stress mark. Do not guess a stress position."
    why: "It is hyphenated, pronounceable, and follows a word. No CAPS only means stress is unspecified."
    confidence: "medium"
  - id: "bracket-spelled-letters-atp"
    input: "Adenosine triphosphate [A-T-P] stores chemical energy."
    readings:
      - "respelling with three syllables"
      - "letter spelling"
    recommended: "Not a respelling. Speak the letters A T P."
    why: "Each hyphen-separated unit is a bare letter name with no vowel nucleus, and the output equals plain letter spelling."
    confidence: "medium"
  - id: "bracket-multiple-caps-syllables"
    input: "Phosphofructokinase [FOS-foh-FRUK-toh-KY-nays] is a key regulatory enzyme."
    readings:
      - "first CAPS syllable is primary stress"
      - "last CAPS syllable is primary stress"
      - "all CAPS syllables are primary"
    recommended: "Respelling. Mark the first CAPS syllable with ˈ and every later CAPS syllable with ˌ."
    why: "NSB guides capitalize every stressed syllable. The true primary position cannot be recovered from the notation. No fixture uses this form."
    confidence: "low"
  - id: "headword-extent-hyphenated-compound"
    input: "Michaelis-Menten [mi-KAY-lis MEN-tun] kinetics describe enzyme rates."
    readings:
      - "word is Michaelis-Menten"
      - "word is the two tokens before the bracket"
    recommended: "word is Michaelis-Menten. Take the shortest suffix before the bracket whose hyphen-split unit count equals the respelling word count. If none matches, take the single whitespace token."
    why: "The respelling has 2 words and the compound has 2 hyphen units. Counting whitespace tokens would swallow the previous word."
    confidence: "medium"
  - id: "alternate-pronunciations-with-or"
    input: "Pecan [pi-KAHN or PEE-kan] is a nut."
    readings:
      - "one respelling with an or-alternative"
      - "two respellings"
    recommended: "Speak the first alternative only. respellings holds the full bracket text. Consumers take the text before ' or '."
    why: "Dictionary style lists the primary variant first. Speaking both would stutter."
    confidence: "low"
  - id: "bracket-interval-notation"
    input: "On the closed interval [0, 1] the function is increasing."
    readings:
      - "respelling"
      - "math interval"
      - "footnote marker"
    recommended: "Not a respelling. Speak the closed interval from zero to one. The literal [ never reaches the TTS."
    why: "Numeric content with a comma pair is interval notation. It cannot match respelling shape."
    confidence: "medium"
  - id: "bracket-bare-integer-footnote"
    input: "The Great Barrier Reef [1] is the largest coral reef system on Earth."
    readings:
      - "footnote marker: drop silently"
      - "value: speak one"
    recommended: "Not a respelling. Drop a bare integer in brackets that directly follows a word and has no operator or unit."
    why: "It is a citation marker in pasted web text. Speaking one mid-sentence breaks the sentence. Fixture 35-general-science-barrier-reef-footnote-sa accepts either behavior until product decides."
    confidence: "medium"
  - id: "answer-line-respelling"
    input: "ANSWER: TROPONIN [TROH-puh-nin]"
    readings:
      - "extract into respellings"
      - "keep only inside answer"
    recommended: "Keep inside answer verbatim. Do not add to respellings. When read_answer is true, apply the same respelling rule to the spoken answer."
    why: "The answer is not spoken by default (R2). parse_cases.yaml follows this for fixture 55-life-science-calcium-signaling-mixed-brackets-sa."
    confidence: "high"
  - id: "initials-at-line-start-look-like-choice-marker"
    input: "The father-and-son team of\nW. H. Bragg and W. L. Bragg shared the prize.\nW. X-rays\nX. Neutrons\nY. Alpha particles\nZ. Visible light"
    readings:
      - "line-initial W. H. is choice W"
      - "line-initial W. H. is part of the stem"
    recommended: "Accept a W marker only when X, Y and Z markers follow in order. Anchor on the last W marker before the X marker. The earlier W. H. stays in the stem."
    why: "Initials with a period look identical to dot-style markers. Only the ordered W-X-Y-Z run tells them apart. Fixture 22 uses the paren style, which is easier."
    confidence: "medium"
  - id: "choices-inline-on-one-line"
    input: "In the figure, point (X) lies on the line. W) 3 X) 4 Y) 5 Z) 6"
    readings:
      - "four inline choices"
      - "X) is part of the stem"
    recommended: "Split on W) X) Y) Z) when the four markers occur in order and each marker follows whitespace or line start. (X) in the stem is not a marker."
    why: "Clipboard copies often lose newlines. A marker needs a left boundary, which (X) lacks. Fixture 50 covers the plain inline case."
    confidence: "medium"
  - id: "line-final-hyphen-wrap"
    input: "The membrane controls the movement of respira-\ntory gases."
    readings:
      - "join as respiratory"
      - "keep respira- tory"
    recommended: "Join the halves without a hyphen when the next line starts lowercase and the joined word is a known word. Otherwise keep the hyphen."
    why: "PDF hard-wrap hyphenation is common. Plain whitespace collapse leaves respira- tory, which a TTS reads as two words. No fixture uses it."
    confidence: "low"
  - id: "unicode-minus-vs-hyphen-negative"
    input: "x = −2 and x = -3"
    readings:
      - "negative two"
      - "minus two"
    recommended: "Speak U+2212 or ASCII hyphen-minus directly before a bare number as negative. Speak it between two operands as minus."
    why: "Moderator convention. Fixtures 21, 24 and 25 accept both words until the product decides."
    confidence: "medium"
  - id: "question-boundary-numbered-list-in-stem"
    input: "1) CHEMISTRY Short Answer Rank these from smallest to largest: 1) atom 2) nucleus 3) quark.\nANSWER: QUARK, NUCLEUS, ATOM\n2) BIOLOGY Short Answer Name the organelle that makes ATP."
    readings:
      - "every N) starts a question"
      - "N) inside a stem line is list text"
    recommended: "A question starts at a TOSS-UP or BONUS header, or at a line-initial N) that follows a blank line, an ANSWER line or the start of the paste. N) in the middle of a line is stem text."
    why: "Enumerations such as 1) 2) 3) are common inside stems. Line position and the preceding line tell a new question from a list. No fixture uses the trap."
    confidence: "medium"
  - id: "read-answer-scope"
    input: "ANSWER: MITOCHONDRIAL MATRIX (ACCEPT: MATRIX)"
    readings:
      - "Answer. Mitochondrial Matrix (Accept: Matrix)."
      - "Answer. Mitochondrial Matrix."
    recommended: "Speak only the primary answer, the text before the first ACCEPT or DO NOT ACCEPT note. Keep the full text in answer."
    why: "A moderator reads the primary answer and gives the notes only on challenge. Title-cased notes sound like part of the answer. Only the Y. Esophagus. case is pinned."
    confidence: "low"
  - id: "answer-title-case-acronyms"
    input: "ANSWER: DNA LIGASE"
    readings:
      - "Dna Ligase (naive title case)"
      - "DNA Ligase (acronym kept)"
    recommended: "Title-case an all-caps word only when it is not an acronym, formula or token with a digit. Keep DNA, ATP, CO2 and NaCl as printed so the letter reading still applies."
    why: "Naive title case turns DNA into Dna, which a TTS reads as a word. Formulas break the same way and violate R5."
    confidence: "medium"
