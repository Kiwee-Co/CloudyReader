# Jekyll site for GitHub Pages: branch main, folder /docs, the official Architect theme.
# No url or baseurl here: the Pages build sets both, so every link goes through relative_url
# and works at https://kiwee-co.github.io/CloudyReader/ and at https://cloudyreader.com/.
title: Cloudy Reader
description: Reads National Science Bowl questions aloud on your Mac.
lang: en-US
repository: Kiwee-Co/CloudyReader
theme: jekyll-theme-architect
show_downloads: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# The only plugins the site uses; both are on the GitHub Pages allow list.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .jekyll-cache
  - .sass-cache

# Values the templates read. Edit links open the page source on the default branch.
repo_url: https://github.com/Kiwee-Co/CloudyReader
edit_url: https://github.com/Kiwee-Co/CloudyReader/edit/main/docs/
license_name: Apache-2.0
license_url: https://github.com/Kiwee-Co/CloudyReader/blob/main/LICENSE

# Navigation group order. Each page names its group and its place in it: nav_group, nav_order.
nav_groups:
  - Manual
  - Developer
