# Pull request check for the GitHub Pages site in docs/: build it with the Pages Jekyll image,
# then run the site checker. Pages deploys from branch main, folder /docs; nothing deploys here.
name: site-build

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/*site*"
      - ".github/workflows/site-build.yml"

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-build:
    name: site-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      # Standard library only; ubuntu-24.04 ships Python 3.12.
      - name: Check the site source
        run: python3 scripts/check_site.py docs
