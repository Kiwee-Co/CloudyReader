# The job named `ci` is the one required status check: it passes only when every other job did.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request run is replaced by its next push. Any other run gets a group of its own,
# so nothing cancels it and a run on main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # PyPI versions of the tools that uvx and uv tool install fetch. Bump them here only.
  # Unverified until the first run: they are GitHub release tags, read without PyPI access.
  SHELLCHECK_PY: '0.11.0.1'
  ACTIONLINT_PY: '1.7.12.25'
  ZIZMOR: '1.31.1'
  # npm versions of the format tools, read from the owner's local installs.
  PRETTIER: '3.9.10'
  MARKDOWNLINT_CLI: '0.50.0'

jobs:
  guards:
    name: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scripts/ci_guards.py: vendor domain, uv.lock hosts, disk paths, workflow triggers.
      - name: Repo guards
        run: make guards

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_MANAGED_PYTHON: '1'
      UV_NO_PROGRESS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-local-path: ${{ github.workspace }}/.cache/uv
          prune-cache: true

      # The dev group only: ruff and PyYAML at the versions uv.lock pins, without the app.
      - name: Install the dev group
        run: uv sync --frozen --only-group dev

      - name: Ruff
        run: |
          .venv/bin/ruff --version
          .venv/bin/ruff check . --output-format=github
          .venv/bin/ruff format --check --diff .

      - name: YAML under .github
        run: .venv/bin/python scripts/ci_yaml.py

      - name: Install ShellCheck
        run: uv tool install --python "$(cat .python-version)" "shellcheck-py==$SHELLCHECK_PY"

      - name: ShellCheck
        run: |
          PATH="$(uv tool dir --bin):$PATH"
          shellcheck --version
          git ls-files -z -- '*.sh' | xargs -0 -r shellcheck

      # With shellcheck on PATH, actionlint also lints the shell in every run block.
      # The format turns each finding into a check annotation, which a reader sees without logs.
      - name: actionlint
        run: |
          PATH="$(uv tool dir --bin):$PATH"
          format='{{range .}}::error file={{.Filepath}},line={{.Line}},col={{.Column}},title=actionlint {{.Kind}}::{{.Message}}\n{{end}}'
          uvx --python "$(cat .python-version)" --from "actionlint-py==$ACTIONLINT_PY" actionlint -format "$format"

      # Offline: no token, so no online audits. The github format puts each finding in the check
      # annotations. The gate is medium: the one Low finding is the npm install of the format tools
      # without a lockfile, a listed follow-up.
      - name: zizmor
        run: uvx --python "$(cat .python-version)" "zizmor==$ZIZMOR" --offline --min-severity medium --format github .github/workflows

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_MANAGED_PYTHON: '1'
      UV_NO_PROGRESS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-local-path: ${{ github.workspace }}/.cache/uv
          prune-cache: true

      # The hooks are local and need no clone, so there is no hook cache to restore.
      # The ruff hooks run .venv/bin/ruff, so the dev group goes in first.
      - name: Install the dev group
        run: uv sync --frozen --only-group dev

      - name: Install pre-commit and shellcheck
        run: |
          uv tool install --python "$(cat .python-version)" pre-commit==4.7.0
          uv tool install --python "$(cat .python-version)" "shellcheck-py==$SHELLCHECK_PY"

      # A hook that finds no tool would fail late; name the missing tool first.
      # The format job runs the prettier and markdownlint hooks, so this job skips them.
      - name: Run the other hooks
        run: |
          PATH="$(uv tool dir --bin):$PATH"
          command -v pre-commit >/dev/null || { echo "::error::pre-commit not on PATH"; exit 1; }
          command -v shellcheck >/dev/null || { echo "::error::shellcheck not on PATH"; exit 1; }
          SKIP=prettier,markdownlint pre-commit run --all-files --show-diff-on-failure

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_MANAGED_PYTHON: '1'
      UV_NO_PROGRESS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.28'
          enable-cache: false

      # Node and npm ship on the runner image. Exact versions, no install script, no lockfile yet:
      # a committed lockfile and `npm ci --ignore-scripts` are a follow-up (zizmor gates at medium).
      - name: Install Prettier and markdownlint
        run: |
          npm install --prefix "$RUNNER_TEMP/format-tools" --ignore-scripts --no-audit --no-fund \
            "prettier@$PRETTIER" "markdownlint-cli@$MARKDOWNLINT_CLI"

      - name: Install pre-commit
        run: uv tool install --python "$(cat .python-version)" pre-commit==4.7.0

      # The hooks hold the flags and the exclude lists, so CI and a local commit agree.
      - name: Prettier
        run: |
          PATH="$RUNNER_TEMP/format-tools/node_modules/.bin:$(uv tool dir --bin):$PATH"
          prettier --version
          pre-commit run --all-files prettier

      - name: markdownlint
        run: |
          PATH="$RUNNER_TEMP/format-tools/node_modules/.bin:$(uv tool dir --bin):$PATH"
          markdownlint --version
          pre-commit run --all-files markdownlint

  test:
    name: test
    # macOS arm64: afplay, afinfo and wheels that need macOS 14+. macos-14 retired 2026-11-02.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      UV_MANAGED_PYTHON: '1'
      UV_NO_PROGRESS: '1'
      QT_QPA_PLATFORM: offscreen
      CLOUDYREADER_OFFLINE: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv 0.9.28 is the local version. It meets pyproject's uv_build bound, so no backend download.
      # cache-local-path is the Makefile's UV_CACHE_DIR, so `uv run --offline` finds the same cache.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-local-path: ${{ github.workspace }}/.cache/uv
          prune-cache: true

      - name: Show toolchain
        run: |
          echo "image ${ImageVersion:-unknown}"
          sw_vers -productVersion
          uname -m
          uv --version
          make --version | sed -n 1p

      - name: Install locked dependencies
        run: |
          uv sync --frozen
          .venv/bin/python -VV

      # The same gate as `make test`: markers and coverage floor come from the Makefile.
      # PYTEST_ADDOPTS only adds the two report files.
      - name: Test gate (make test)
        run: |
          REPORT_DIR="$RUNNER_TEMP/reports"
          mkdir -p "$REPORT_DIR"
          export PYTEST_ADDOPTS="--junitxml=$REPORT_DIR/junit.xml --cov-report=xml:$REPORT_DIR/coverage.xml"
          make test

      - name: Summarize the run
        if: ${{ !cancelled() }}
        run: |
          REPORT_DIR="$RUNNER_TEMP/reports"
          python3 -I scripts/ci_summary.py --junit "$REPORT_DIR/junit.xml" \
            --coverage "$REPORT_DIR/coverage.xml" >> "$GITHUB_STEP_SUMMARY"
          # The check-run annotations are served without a login, so a failure names its tests.
          python3 -I scripts/ci_summary.py --junit "$REPORT_DIR/junit.xml" \
            --coverage "$REPORT_DIR/coverage.xml" --annotate

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: ${{ runner.temp }}/reports
          retention-days: 14
          if-no-files-found: warn

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # site/.node-version names the Node release; site/package.json allows 22.23.4 or later.
      # No npm cache: `npm ci` takes seconds, and a restored cache is one more input to trust.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version

      - name: Install the locked packages
        working-directory: site
        run: npm ci

      - name: Build the site
        working-directory: site
        run: npm run build

      # Standard library only. It reads the built HTML, so it checks what visitors get.
      - name: Check the built site
        run: python3 scripts/check_site.py site/dist

  lock:
    name: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_MANAGED_PYTHON: '1'
      UV_NO_PROGRESS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.28'
          enable-cache: false

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

  # Branch protection requires only this job. It runs even when a job failed or was skipped.
  ci:
    name: ci
    needs: [guards, lint, pre-commit, format, test, docs, lock]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: >-
        guards=${{ needs.guards.result }}
        lint=${{ needs.lint.result }}
        pre-commit=${{ needs.pre-commit.result }}
        format=${{ needs.format.result }}
        test=${{ needs.test.result }}
        docs=${{ needs.docs.result }}
        lock=${{ needs.lock.result }}
    steps:
      - name: Every job must succeed
        run: |
          fail=0
          for pair in $RESULTS; do
            echo "$pair"
            [ "${pair#*=}" = success ] || fail=1
          done
          exit "$fail"
