# Builds the Starlight site in site/ and publishes it to GitHub Pages when main changes.
# Needs Settings > Pages > Build and deployment > Source = "GitHub Actions". The custom domain
# cloudyreader.com and "Enforce HTTPS" stay as they are.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default: each job asks for the one thing it needs.
permissions: {}

# One deploy at a time, and a deploy that has started is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout reads the repository
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache here: this workflow publishes, so it restores nothing it did not just build.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version

      - name: Install the locked packages
        working-directory: site
        run: npm ci

      - name: Build the site
        working-directory: site
        run: npm run build

      # The same check as the docs job in ci.yml, so a site that fails it is never published.
      - name: Check the built site
        run: python3 scripts/check_site.py site/dist

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publishes the uploaded site to Pages
      id-token: write # proves to Pages that this run built it
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
